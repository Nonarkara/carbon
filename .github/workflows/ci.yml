name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: |
          npm run dev > /tmp/carbon-dev.log 2>&1 &
          dev_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "----- dev server log -----"; cat /tmp/carbon-dev.log || true; fi; kill "$dev_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "dev server did not listen on 127.0.0.1:8788"; exit 1; fi
          npm run test:browser
          npm run test:client
          npm run test:manual
          BASE_URL=http://127.0.0.1:8788 node scripts/privacy-browser-test.mjs
          node scripts/forest-watch-browser-test.mjs
          node scripts/flat-ui-browser-test.mjs
          node scripts/bible-design-browser-test.mjs
          npm run test:design
          BASE_URL=http://127.0.0.1:8788 node scripts/academic-browser-test.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
