name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: |
          npm run dev > /tmp/carbon-dev.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8788/ > /dev/null && break || sleep 1; done
          npm run test:browser
          npm run test:client
          npm run test:manual
          BASE_URL=http://127.0.0.1:8788 node scripts/privacy-browser-test.mjs
          node scripts/forest-watch-browser-test.mjs
          node scripts/flat-ui-browser-test.mjs
          node scripts/bible-design-browser-test.mjs
          node scripts/sea-browser-test.mjs
          node scripts/ship-browser-test.mjs
          node scripts/release-audit-browser-test.mjs
          npm run test:design
          BASE_URL=http://127.0.0.1:8788 node scripts/academic-browser-test.mjs
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
