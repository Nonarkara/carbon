name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser flows
        # One command, one server this project started itself. The old block started a server
        # on a hardcoded port in the background and waited for it by hand, then ran sixteen
        # suites against it — a measurement that can land on whatever else holds that port.
        run: npm run test:browser:all -- --no-build
      - name: Spatial law gates
        run: npm run test:spatial -- --no-build
      - name: Deep content spatial audit
        run: npm run test:deep
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
