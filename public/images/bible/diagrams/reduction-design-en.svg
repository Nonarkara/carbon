<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="Intensity can improve while total emissions rise"><title>Intensity can improve while total emissions rise</title><desc>Intensity can improve while total emissions rise; 100 → 110 tCO₂e → 1,000 → 1,200 units → 0.100 → 0.0917 → Absolute +10%</desc><metadata>New original diagram: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="head-reduction-design" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#161616"/></marker></defs><rect width="600" height="270" fill="white"/><rect x="15" y="35" width="275" height="75" fill="#ffdf00" stroke="#161616" stroke-width="2"/><text x="27" y="71" font-size="15" fill="#161616">100 → 110 tCO₂e</text><rect x="310" y="35" width="275" height="75" fill="#fff" stroke="#161616" stroke-width="2"/><text x="322" y="71" font-size="15" fill="#161616">1,000 → 1,200 units</text><text x="25" y="158" font-size="17" fill="#161616">tCO₂e / output unit</text><text x="25" y="194" font-size="24" fill="#161616">0.100 → 0.0917</text><rect x="350" y="150" width="230" height="75" fill="#1643c5" stroke="#161616" stroke-width="2"/><text x="362" y="186" font-size="15" fill="white">Absolute +10%</text></svg>