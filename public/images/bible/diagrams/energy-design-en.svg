<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="Two accounting views of the same purchased electricity"><title>Two accounting views of the same purchased electricity</title><desc>Two accounting views of the same purchased electricity; Purchased kWh → Location basis → Market basis → Do not add</desc><metadata>New original diagram: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="head-energy-design" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#161616"/></marker></defs><rect width="600" height="270" fill="white"/><rect x="175" y="15" width="250" height="65" fill="#ffdf00" stroke="#161616" stroke-width="2"/><text x="187" y="51" font-size="15" fill="#161616">Purchased kWh</text><path d="M240 80L135 121" stroke="#161616" stroke-width="2" marker-end="url(#head-energy-design)"/><path d="M360 80L465 121" stroke="#161616" stroke-width="2" marker-end="url(#head-energy-design)"/><rect x="25" y="125" width="235" height="64" fill="#fff" stroke="#161616" stroke-width="2"/><text x="37" y="161" font-size="15" fill="#161616">Location basis</text><rect x="335" y="125" width="235" height="64" fill="#1643c5" stroke="#161616" stroke-width="2"/><text x="347" y="161" font-size="15" fill="white">Market basis</text><text x="220" y="235" font-size="18" fill="#161616">Do not add</text></svg>