<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="เลือกการตัดสินใจก่อนเลือกตัวเลข"><title>เลือกการตัดสินใจก่อนเลือกตัวเลข</title><desc>เลือกการตัดสินใจก่อนเลือกตัวเลข; ตัดสินใจอะไร → ปริมาณและขอบเขต → ขอหลักฐาน → ผลที่ใช้ได้</desc><metadata>New original diagram: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="head-decision-guide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#161616"/></marker></defs><rect width="600" height="270" fill="white"/><rect x="15" y="35" width="260" height="70" fill="#ffdf00" stroke="#161616" stroke-width="2"/><text x="27" y="71" font-size="15" fill="#161616">ตัดสินใจอะไร</text><rect x="325" y="35" width="260" height="70" fill="#fff" stroke="#161616" stroke-width="2"/><text x="337" y="71" font-size="15" fill="#161616">ปริมาณและขอบเขต</text><rect x="15" y="155" width="260" height="70" fill="#1643c5" stroke="#161616" stroke-width="2"/><text x="27" y="191" font-size="15" fill="white">ผลที่ใช้ได้</text><rect x="325" y="155" width="260" height="70" fill="#fff" stroke="#161616" stroke-width="2"/><text x="337" y="191" font-size="15" fill="#161616">ขอหลักฐาน</text><path d="M277 70L320 70" stroke="#161616" stroke-width="2" marker-end="url(#head-decision-guide)"/><path d="M455 107L455 150" stroke="#161616" stroke-width="2" marker-end="url(#head-decision-guide)"/><path d="M320 190L280 190" stroke="#161616" stroke-width="2" marker-end="url(#head-decision-guide)"/></svg>