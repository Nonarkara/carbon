<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="ทวนสอบจากภาคสนามถึงข้อมูลทดสอบอิสระ"><title>ทวนสอบจากภาคสนามถึงข้อมูลทดสอบอิสระ</title><desc>ทวนสอบจากภาคสนามถึงข้อมูลทดสอบอิสระ; ประชากรเป้าหมาย → แปลงแยกชั้น → ปรับแบบจำลอง → ทดสอบอิสระ</desc><metadata>New original diagram: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="head-sea-mrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#161616"/></marker></defs><rect width="600" height="270" fill="white"/><rect x="15" y="35" width="260" height="70" fill="#ffdf00" stroke="#161616" stroke-width="2"/><text x="27" y="71" font-size="15" fill="#161616">ประชากรเป้าหมาย</text><rect x="325" y="35" width="260" height="70" fill="#fff" stroke="#161616" stroke-width="2"/><text x="337" y="71" font-size="15" fill="#161616">แปลงแยกชั้น</text><rect x="15" y="155" width="260" height="70" fill="#1643c5" stroke="#161616" stroke-width="2"/><text x="27" y="191" font-size="15" fill="white">ทดสอบอิสระ</text><rect x="325" y="155" width="260" height="70" fill="#fff" stroke="#161616" stroke-width="2"/><text x="337" y="191" font-size="15" fill="#161616">ปรับแบบจำลอง</text><path d="M277 70L320 70" stroke="#161616" stroke-width="2" marker-end="url(#head-sea-mrv)"/><path d="M455 107L455 150" stroke="#161616" stroke-width="2" marker-end="url(#head-sea-mrv)"/><path d="M320 190L280 190" stroke="#161616" stroke-width="2" marker-end="url(#head-sea-mrv)"/></svg>